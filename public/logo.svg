  </g>

  <!-- Right Stars -->
  <g transform="translate(168, 118) scale(0.65)" fill="#f42a41">
    <polygon points="10,1 12,7 18,7 13,11 15,17 10,13 5,17 7,11 2,7 8,7" />
  </g>
  <g transform="translate(154, 142) scale(0.65)" fill="#f42a41">
    <polygon points="10,1 12,7 18,7 13,11 15,17 10,13 5,17 7,11 2,7 8,7" />
  </g>
