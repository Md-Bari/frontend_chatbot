      গণপ্রজাতন্ত্রী বাংলাদেশ
    </textPath>
  </text>

  <text fill="#006a4e" font-size="17" font-weight="900" font-family="'Noto Sans Bengali', 'SolaimanLipi', 'Kalpurush', sans-serif" letter-spacing="3">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">
      সরকার
    </textPath>
  </text>

  <!-- 4 Red Stars (2 left, 2 right) -->
  <!-- Left Stars -->
  <g transform="translate(18, 118) scale(0.65)" fill="#f42a41">
    <polygon points="10,1 12,7 18,7 13,11 15,17 10,13 5,17 7,11 2,7 8,7" />
  </g>
  <g transform="translate(32, 142) scale(0.65)" fill="#f42a41">
